---
services:
  samba:
    image: docker.io/dockurr/samba
    container_name: storage-samba
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./smb.conf:/etc/samba/smb.conf:ro
      - ./samba/users.conf:/etc/samba/users.conf:ro
      - samba-data:/var/lib/samba
      - /mnt:/mnt:rw
      - /etc/passwd:/etc/passwd:ro
      - /etc/group:/etc/group:ro

  web:
    image: docker.io/library/nginx:stable
    restart: unless-stopped
    volumes:
      - /mnt:/data:ro
      - ./nginx:/etc/nginx/conf.d:ro
    networks:
      - container-dmz
    labels:
      traefik.enable: true
      traefik.http.routers.homie.rule: Host(`homie.lab.campcomputer.com`)
      traefik.http.routers.homie.tls.certresolver: namecheap
      traefik.http.routers.homie-http.entrypoints: http
      traefik.http.routers.homie-http.rule: Host(`homie.lab.campcomputer.com`)
      traefik.http.services.homie.loadbalancer.server.port: 80

networks:
  container-dmz:
    external: true
volumes:
  samba-data:
  caddy-data:
