authorization: {
  version: 1
  rules: [
      {
          "allow-unauthenticated": true,
          "match-request": {
              "method": [
                  "get"
              ],
              "path": "^/puppet/v3/file",
              "type": "regex"
          },
          "name": "allow unauthenticated file requests",
          "sort-order": 1
      }
  ,
      {
          "allow-unauthenticated": true,
          "match-request": {
              "method": [
                  "get"
              ],
              "path": "/status/v1/",
              "type": "path"
          },
          "name": "allow status endpoint",
          "sort-order": 2
      }
  ,
      {
          "deny": "*",
          "match-request": {
              "path": "/",
              "type": "path"
          },
          "name": "deny all",
          "sort-order": 999
      }
  ,
      {
          "allow": "*",
          "match-request": {
              "method": "delete",
              "path": "/puppet-admin-api/v1/environment-cache",
              "type": "path"
          },
          "name": "puppet admin api clear caches",
          "sort-order": 500
      }
  
  ]
}
