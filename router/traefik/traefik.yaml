global:
  checkNewVersion: true

log:
  level: "INFO"
  filePath: ""

accessLog:
  filePath: ""
  bufferingSize: 100

api:
  insecure: true

entryPoints:
  http:
    address: ":80"
# disabled until we are sure that kickstart works
#    http:
#      redirections:
#        entryPoint:
#          to: ':443'
#          scheme: https
  https:
    address: ":443"
    http:
      tls: true
  # Easier than to teach every puppet client about our "weird" port of 443 above.
  puppet:
    address: ":8140"
    http:
      tls: true

providers:
  docker:
    exposedByDefault: false
    network: container-dmz
  file:
    filename: /etc/traefik/dynamic.yaml
    watch: true

ping:
  entryPoint: https

certificatesResolvers:
  namecheap:
    acme:
      email: cohoe.grant@gmail.com
      storage: /certs/namecheap.json
      dnsChallenge:
        provider: namecheap
        resolvers:
          - "156.154.132.200:53" # dns1.registrar-servers.com.
          - "156.154.133.200:53" # dns2.registrar-servers.com.
          - "8.8.8.8:53" # dns.google.
        delayBeforeCheck: 10

serversTransport:
  # This is needed to avoid validating any internal certificates
  insecureSkipVerify: true

metrics:
  prometheus:
    entryPoint: https
    addRoutersLabels: true
