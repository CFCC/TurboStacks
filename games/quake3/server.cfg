// Dedicated Server
seta dedicated 1

// Game settings
seta g_gametype 0
seta g_doWarmup 0
seta g_warmup 0
seta g_inactivity 120
seta fraglimit 30
seta timelimit 10

// Server identity
seta sv_hostname "CFTF"
seta sv_maxclients 32
seta sv_allowDownload 1
seta sv_privateClients 0
seta sv_pure 1
rconpassword "camper"

// Network performance
seta sv_fps 40
snaps 40
seta sv_maxRate 25000

// Auto-fill with bots (bots leave as humans join)
seta bot_minplayers 6
seta bot_nochat 1

// Map Rotation
set d1 "map q3dm6 ; set nextmap vstr d2"
set d2 "map q3tourney3 ; set nextmap vstr d3"
set d3 "map q3tourney5 ; set nextmap vstr d4"
set d4 "map q3dm12 ; set nextmap vstr d5"
set d5 "map q3dm15 ; set nextmap vstr d6"
set d6 "map q3dm17 ; set nextmap vstr d7"
set d7 "map ezdmcf2 ; set nextmap vstr d1"
vstr d1
